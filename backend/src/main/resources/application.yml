spring:
  application:
    name: fcms

  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: dbo
    defer-datasource-initialization: false

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: false
    out-of-order: false
    validate-on-migrate: true
    validate-migration-naming: true
    clean-disabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_TIMEOUT:5000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:5000}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  cache:
    type: ${SPRING_CACHE_TYPE:simple}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}

gemini:
  api-key: ${GEMINI_API_KEY}
  chat-model: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}
  embedding-model: ${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  max-image-size-bytes: ${CLOUDINARY_MAX_IMAGE_SIZE_BYTES:5242880}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

otp:
  expiration-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: "health,metrics"
  endpoint:
    health:
      show-details: never

app:
  reports:
    storage-dir: ${REPORTS_STORAGE_DIR:reports}

clamav:
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}

fcms:
  frontend-url: ${FRONTEND_URL}
  feedback:
    public-base-url: ${FEEDBACK_PUBLIC_BASE_URL}
  payment:
    bank-name: ${PAYMENT_BANK_NAME}
    account-name: ${PAYMENT_ACCOUNT_NAME}
    bank-branch: ${PAYMENT_BANK_BRANCH}
    sepay:
      account-number: ${SEPAY_ACCOUNT_NUMBER}
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY}
      # Bỏ trống api-token thì phần đối soát định kỳ tự tắt, chỉ còn webhook.
      api-token: ${SEPAY_API_TOKEN:}
      api-base-url: ${SEPAY_API_BASE_URL}
      reconcile-cron: ${SEPAY_RECONCILE_CRON}
      reconcile-lookback-minutes: ${SEPAY_RECONCILE_LOOKBACK_MINUTES}
  guest:
    status-base-url: ${GUEST_STATUS_BASE_URL}
    lookup-url: ${GUEST_LOOKUP_URL}