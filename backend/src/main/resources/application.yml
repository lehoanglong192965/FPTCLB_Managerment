spring:
  application:
    name: fcms

  config:
    # Spring Boot không tự đọc file .env. Hỗ trợ chạy từ thư mục backend
    # hoặc từ thư mục gốc của repository; biến môi trường hệ thống vẫn
    # có độ ưu tiên cao hơn các giá trị trong file này.
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      # Flyway is the single source of truth for schema changes. Letting
      # Hibernate update the same SQL Server schema causes ALTER COLUMN to
      # collide with default constraints and indexes managed by migrations.
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

    show-sql: true
    open-in-view: false

    properties:
      hibernate:
        format_sql: true
        default_schema: dbo
    defer-datasource-initialization: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    out-of-order: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

  cache:
    type: ${SPRING_CACHE_TYPE:simple}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}

gemini:
  api-key: ${GEMINI_API_KEY:}
  chat-model: gemini-3.1-flash-lite
  embedding-model: gemini-embedding-001

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}
  max-image-size-bytes: ${CLOUDINARY_MAX_IMAGE_SIZE_BYTES:5242880}

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-http-form-post-size: -1
    max-swallow-size: -1

# OTP Configuration
otp:
  expiration-minutes: 10

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: "health,metrics"
  endpoint:
    health:
      show-details: always

app:
  reports:
    storage-dir: ${REPORTS_STORAGE_DIR:reports}

clamav:
  host: ${CLAMAV_HOST:localhost}
  port: ${CLAMAV_PORT:3310}

fcms:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  feedback:
    public-base-url: ${FEEDBACK_PUBLIC_BASE_URL:http://localhost:5173/feedback/guest}
  payment:
    bank-name: ${PAYMENT_BANK_NAME:MB Bank}
    account-name: ${PAYMENT_ACCOUNT_NAME:LE HOANG LONG}
    bank-branch: ${PAYMENT_BANK_BRANCH:MB Bank}
    sepay:
      account-number: ${SEPAY_ACCOUNT_NUMBER:0796578863}
      webhook-api-key: ${SEPAY_WEBHOOK_API_KEY:}
  guest:
    status-base-url: ${GUEST_STATUS_BASE_URL:http://localhost:5173/guest/status}
    lookup-url: ${GUEST_LOOKUP_URL:http://localhost:5173/guest/lookup}

