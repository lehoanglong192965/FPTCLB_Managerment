# Local-only two-phase SQL Server bootstrap verification. Production runs the
# backend JAR on Azure App Service and does not use this Compose file.
#
# Phase A: docker compose up --build
# Phase B (same SQL volume):
#   $env:SPRING_FLYWAY_ENABLED='true'
#   $env:SPRING_JPA_HIBERNATE_DDL_AUTO='none'
#   docker compose up --build backend

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fcms-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: "Express"
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports:
      - "127.0.0.1:14330:1433"
    volumes:
      - fcms_sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa
        -P "$${MSSQL_SA_PASSWORD}" -C
        -Q "IF DB_ID(N'FPTUCLUB') IS NULL CREATE DATABASE [FPTUCLUB]"

  backend:
    build:
      context: ./backend
    container_name: fcms-backend
    depends_on:
      sqlserver-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: "8080"
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=FPTUCLUB;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: sa
      DB_PASSWORD: "YourStrong!Passw0rd"
      JWT_SECRET: "local_dev_only_change_me_1234567890_abcdefghijklmnopqrstuvwxyz"
      MAIL_USERNAME: "local@example.invalid"
      MAIL_PASSWORD: "dummy-local-password"
      GOOGLE_CLIENT_ID: "dummy-local-id"
      GOOGLE_CLIENT_SECRET: "dummy-local-secret"
      GEMINI_API_KEY: "dummy-local-key"
      CLOUDINARY_CLOUD_NAME: "dummy-local-cloud"
      CLOUDINARY_API_KEY: "dummy-local-key"
      CLOUDINARY_API_SECRET: "dummy-local-secret"
      FRONTEND_URL: "http://localhost:5173"
      SPRING_CACHE_TYPE: simple
      REPORTS_STORAGE_DIR: /app/reports
      SPRING_FLYWAY_ENABLED: "${SPRING_FLYWAY_ENABLED:-false}"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}"

volumes:
  fcms_sqlserver_data:
